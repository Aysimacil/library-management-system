# Substitute the deployment domain and provision its certificate before use.
log_format library_safe '$time_iso8601 status=$status method=$request_method duration=$request_time';

upstream library_backend {
    server unix:/run/library/gunicorn.sock;
}

server {
    listen 80;
    server_name library.example.test;
    return 301 https://library.example.test$request_uri;
}

server {
    listen 443 ssl;
    server_name library.example.test;
    ssl_certificate /etc/letsencrypt/live/library.example.test/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/library.example.test/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    access_log /var/log/nginx/library-access.log library_safe;
    error_log /var/log/nginx/library-error.log crit;

    location /static/ {
        alias /srv/library/static/;
        add_header X-Content-Type-Options nosniff always;
    }
    location /media/ {
        return 404;
    }
    location / {
        proxy_pass http://library_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }
}
